<!-- MathJax v4: renders MathML produced by LaTeXML with New Computer Modern  -->
<!-- font — the standard academic math font used by arXiv and most journals.   -->
<!-- mml-chtml.js = MathML input + CommonHTML output (no TeX source needed).   -->
<script>
MathJax = {
  chtml: {
    font: 'mathjax-modern'   /* Computer Modern — matches LaTeX PDF output */
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4/mml-chtml.js" async></script>

{{- if .Params.latex }}
<!-- LaTeXML + pensee article stylesheets — loaded in <head> so rules apply  -->
<!-- to all page elements, including .post-meta-pdf rendered above the fold.  -->
<link rel="stylesheet" href="/css/LaTeXML.css">
<link rel="stylesheet" href="/css/ltx-article.css">
<link rel="stylesheet" href="/fonts/npm/computer-modern/cmu-serif-current.css">
<link rel="stylesheet" href="/css/pensee-latex.css">
{{- end }}
