<!-- MathJax v4: renders MathML produced by LaTeXML with New Computer Modern  -->
<!-- font — the standard academic math font used by arXiv and most journals.   -->
<!-- mml-chtml.js = MathML input + CommonHTML output (no TeX source needed).   -->
<script>
MathJax = {
  chtml: {
    font: 'mathjax-modern'   /* Computer Modern — matches LaTeX PDF output */
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4/mml-chtml.js" async></script>
